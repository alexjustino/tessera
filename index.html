<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tessera</title>
    <!--
      The opening. In the page, because it exists for the moment before anything
      else has loaded. public/opening.css draws it, src/app/opening.ts takes it away,
      and it sets the mark from src-tauri/icons/tessera.svg tile by tile: the ground,
      three tiles, then the fourth lands as a task and its check is drawn.
    -->
    <link rel="stylesheet" href="/opening.css" />
  </head>
  <body>
    <div id="opening" aria-hidden="true" hidden>
      <svg viewBox="0 0 256 256">
        <defs>
          <linearGradient id="opening-ground" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2b97ff" />
            <stop offset=".6" stop-color="#0f62d6" />
            <stop offset="1" stop-color="#0a3f9e" />
          </linearGradient>
          <radialGradient id="opening-sheen" cx=".25" cy=".15" r=".8">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".32" />
            <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="opening-tile" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="1" stop-color="#dcebff" />
          </linearGradient>
          <linearGradient id="opening-done" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2fd3a4" />
            <stop offset="1" stop-color="#0a9270" />
          </linearGradient>
          <linearGradient id="opening-gloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".38" />
            <stop offset=".5" stop-color="#ffffff" stop-opacity="0" />
          </linearGradient>
          <filter id="opening-set" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow
              dx="0"
              dy="5"
              stdDeviation="5"
              flood-color="#00194d"
              flood-opacity=".35"
            />
          </filter>
          <filter id="opening-lift" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow
              dx="0"
              dy="9"
              stdDeviation="8"
              flood-color="#003d2c"
              flood-opacity=".45"
            />
          </filter>
        </defs>
        <g class="opening-ground">
          <rect width="256" height="256" rx="56" fill="url(#opening-ground)" />
          <rect width="256" height="256" rx="56" fill="url(#opening-sheen)" />
          <rect
            x="1.5"
            y="1.5"
            width="253"
            height="253"
            rx="54.5"
            fill="none"
            stroke="#ffffff"
            stroke-opacity=".22"
            stroke-width="3"
          />
        </g>
        <g filter="url(#opening-set)" fill="url(#opening-tile)">
          <rect class="opening-tile" x="50" y="50" width="70" height="70" rx="18" />
          <rect class="opening-tile" x="136" y="50" width="70" height="70" rx="18" />
          <rect class="opening-tile" x="50" y="136" width="70" height="70" rx="18" />
        </g>
        <g class="opening-done" filter="url(#opening-lift)">
          <rect x="136" y="136" width="70" height="70" rx="18" fill="url(#opening-done)" />
          <rect x="136" y="136" width="70" height="70" rx="18" fill="url(#opening-gloss)" />
          <path
            class="opening-check"
            d="M153 172 L166 185 L190 158"
            fill="none"
            stroke="#ffffff"
            stroke-width="11"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </g>
      </svg>
      <p class="opening-name">Tessera</p>
      <p class="opening-greeting" id="opening-greeting"></p>
      <p class="opening-line" id="opening-line"></p>
    </div>
    <div id="root"></div>
    <script>
      // Only the main window opens this way: quick capture has to appear at once.
      (function () {
        var element = document.getElementById('opening');
        var label = '';
        try {
          label = window.__TAURI_INTERNALS__.metadata.currentWindow.label;
        } catch (error) {
          label = 'main';
        }
        if (label !== 'main') {
          element.remove();
          return;
        }

        // Remembered by the application, because the setting itself is still on disk.
        var stored = null;
        var opened = null;
        try {
          stored = localStorage.getItem('tessera.theme');
          opened = localStorage.getItem('tessera.opened');
          localStorage.setItem('tessera.opened', '1');
        } catch (error) {
          // A profile that refuses storage opens as it would on a first run.
        }
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) element.classList.add('opening-dark');

        var hour = new Date().getHours();
        document.getElementById('opening-greeting').textContent =
          opened === null
            ? 'Welcome'
            : hour < 5
              ? 'Working late'
              : hour < 12
                ? 'Good morning'
                : hour < 18
                  ? 'Good afternoon'
                  : 'Good evening';
        // A first opening says what Tessera is for; after that, what day it is.
        var line = '';
        try {
          line =
            opened === null
              ? 'Tasks, notes and time, tile by tile.'
              : new Date().toLocaleDateString(undefined, {
                  weekday: 'long',
                  day: 'numeric',
                  month: 'long',
                });
        } catch (error) {
          // A locale the engine cannot name leaves the line out.
        }
        document.getElementById('opening-line').textContent = line;
        element.hidden = false;

        // If the application never starts, the opening must not sit over the window.
        setTimeout(function () {
          element.remove();
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
