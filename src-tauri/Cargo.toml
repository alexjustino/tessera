[package]
name = "tessera"
version = "0.1.0"
description = "A professional local-first workspace for tasks, projects and time"
authors = ["Alex Justino"]
license = "Apache-2.0"
repository = "https://github.com/alexjustino/tessera"
edition = "2021"
rust-version = "1.80"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows.
name = "tessera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
log = "0.4"
uuid = { version = "1.20.0", features = ["v7"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tauri-plugin-autostart = "2"
tokio = { version = "1.53.1", features = ["time", "sync", "macros", "rt"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
windows = { version = "0.58", features = ["UI_ViewManagement", "Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
