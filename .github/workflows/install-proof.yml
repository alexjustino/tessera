name: Install proof

# The installers on a machine that has never seen Tessera. A hosted runner is a
# fresh Windows every time, so it is the clean machine a developer's own is not.
# It is Windows Server with tools on it rather than somebody's Windows 11, and it
# has WebView2 already, so the runtime's bootstrapper is not proved here.
#
# It walks the path a person walks: the published 1.3.0, a workspace with a task
# in it, this build installed on top, the task still there and the schema migrated, the
# interface appearing, then uninstall, which must leave the data. The WebDriver
# suites cannot run here (ADR-016); they run on the release binary on a developer
# machine (docs/RELEASE.md, step 5).

on:
  workflow_dispatch:
  push:
    branches: ['release/**']

permissions:
  contents: read

jobs:
  install:
    name: Clean machine
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build the installers
        run: npm run tauri build

      - name: There is no Tessera on this machine
        run: |
          foreach ($path in "$env:LOCALAPPDATA\Tessera", "$env:ProgramFiles\Tessera", "$env:APPDATA\io.github.alexjustino.tessera") {
            if (Test-Path $path) { throw "$path already exists: this is not a clean machine" }
          }

      - name: Install the published 1.3.0 and leave a workspace
        run: |
          gh release download v1.3.0 --pattern '*setup.exe' --dir old
          $setup = (Get-ChildItem old\*setup.exe).FullName
          Start-Process -FilePath $setup -ArgumentList '/S' -Wait
          $exe = "$env:LOCALAPPDATA\Tessera\tessera.exe"
          if (-not (Test-Path $exe)) { throw 'the 1.3.0 installer did not put the program where expected' }
          $app = Start-Process -FilePath $exe -PassThru
          $file = "$env:APPDATA\io.github.alexjustino.tessera\tessera.sqlite3"
          for ($i = 0; $i -lt 60 -and -not (Test-Path $file); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $file)) { throw '1.3.0 never made a workspace' }
          Start-Sleep -Seconds 5
          Stop-Process -Name tessera -Force
          Start-Sleep -Seconds 2
          python e2e/fixtures/install_proof.py seed "$file"

      - name: Install this build on top, and nothing is lost
        run: |
          $setup = (Get-ChildItem src-tauri\target\release\bundle\nsis\*setup.exe).FullName
          Start-Process -FilePath $setup -ArgumentList '/S' -Wait
          $exe = "$env:LOCALAPPDATA\Tessera\tessera.exe"
          $version = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "installed version: $version"
          $wanted = (Get-Content package.json | ConvertFrom-Json).version
          if ($version -notlike "$wanted*") { throw "installed $version, built $wanted" }
          Start-Process -FilePath $exe | Out-Null
          $file = "$env:APPDATA\io.github.alexjustino.tessera\tessera.sqlite3"
          $done = $false
          for ($i = 0; $i -lt 60 -and -not $done; $i++) {
            Start-Sleep -Seconds 1
            python e2e/fixtures/install_proof.py check "$file"
            $done = $LASTEXITCODE -eq 0
          }
          $global:LASTEXITCODE = 0
          Stop-Process -Name tessera -Force
          Start-Sleep -Seconds 2
          python e2e/fixtures/install_proof.py check "$file"
          if ($LASTEXITCODE -ne 0) { throw 'the upgrade lost the task or did not migrate' }

      - name: The installed program opens, and its interface appears
        # Read through UI Automation: WebDriver does not start on a hosted runner.
        run: powershell -NoProfile -File e2e/fixtures/install_proof_ui.ps1

      - name: Uninstall, and the data stays
        if: ${{ !cancelled() }}
        run: |
          Start-Process -FilePath "$env:LOCALAPPDATA\Tessera\uninstall.exe" -ArgumentList '/S' -Wait
          $exe = "$env:LOCALAPPDATA\Tessera\tessera.exe"
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw 'uninstall left the program behind' }
          $file = "$env:APPDATA\io.github.alexjustino.tessera\tessera.sqlite3"
          if (-not (Test-Path $file)) { throw 'uninstall took the workspace with it' }
          python e2e/fixtures/install_proof.py check "$file"
          if ($LASTEXITCODE -ne 0) { throw 'the workspace changed on uninstall' }

      - name: The MSI installs, runs and uninstalls
        if: ${{ !cancelled() }}
        run: |
          $msi = (Get-ChildItem src-tauri\target\release\bundle\msi\*.msi).FullName
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart', '/l*v', 'msi-install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec install exited $($p.ExitCode)" }
          # The MSI reuses the folder an earlier install recorded, so a machine that
          # had the NSIS build gets it there rather than in Program Files.
          $exe = "$env:ProgramFiles\Tessera\tessera.exe", "$env:LOCALAPPDATA\Tessera\tessera.exe" | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($null -eq $exe) { throw 'the MSI did not install the program' }
          Write-Host "the MSI installed to $exe"
          Start-Process -FilePath $exe | Out-Null
          Start-Sleep -Seconds 10
          if (-not (Get-Process tessera -ErrorAction SilentlyContinue)) { throw 'the program from the MSI did not stay running' }
          Stop-Process -Name tessera -Force
          $p = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec uninstall exited $($p.ExitCode)" }
          if (Test-Path $exe) { throw 'the MSI uninstall left the program behind' }

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-proof
          path: |
            e2e/artefacts
            msi-install.log
          if-no-files-found: ignore
