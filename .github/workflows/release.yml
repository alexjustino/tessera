name: Release

# Tagging `vX.Y.Z` on `main` builds the Windows installers and attaches them to
# the GitHub Release. A release artefact always comes from a tagged commit that
# passed the gates — never from a developer machine.
#
# Since 1.4.0 installed copies update themselves from what this publishes
# (ADR-062), which makes the signing key the root of trust for every one of them.
# So: actions are pinned by commit, not by a tag that can be moved; the build runs
# without the key; the key is handed to one step that signs two files and nothing
# else; and the signatures are checked against the public key the copies carry
# before anything is published. One build: what the bundle check passed is what
# is signed and published.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build, sign and publish a draft
    runs-on: windows-latest

    steps:
      # A release that could not be signed, or signed with a key the copies do not
      # carry, would publish updates nobody can install. It stops before building.
      - name: The updater key is in place
        shell: pwsh
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if ($env:HAS_KEY -ne 'true') { throw 'The TAURI_SIGNING_PRIVATE_KEY secret is missing.' }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: The public key is the owner's, and the tag is the version
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $key = $config.plugins.updater.pubkey
          if ($key -match 'PENDING' -or $key.Length -lt 40) { throw 'The updater public key is not set.' }
          if ("v$($config.version)" -ne '${{ github.ref_name }}') {
            throw "The tag ${{ github.ref_name }} is not the version $($config.version)."
          }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Gates
        run: npm run gates
        shell: pwsh

      - name: Build the installers
        run: npm run tauri build

      - name: Check the bundle
        run: npm run check:bundle

      # The only step that sees the key. It runs the project's own pinned CLI on
      # two files; no build, no install script, no third-party action.
      - name: Sign the installers
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $bundle = 'src-tauri/target/release/bundle'
          foreach ($file in @("$bundle/nsis/Tessera_${version}_x64-setup.exe", "$bundle/msi/Tessera_${version}_x64_en-US.msi")) {
            npx tauri signer sign --app-version $version $file
            if ($LASTEXITCODE -ne 0) { throw "$file could not be signed." }
          }

      - name: Check the signatures as an installed copy will
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $bundle = 'src-tauri/target/release/bundle'
          foreach ($file in @("$bundle/nsis/Tessera_${version}_x64-setup.exe", "$bundle/msi/Tessera_${version}_x64_en-US.msi")) {
            node scripts/verify-update-signature.mjs $file "$file.sig" $version
            if ($LASTEXITCODE -ne 0) { throw "$file does not verify." }
          }

      # What installed copies read. A copy takes the same kind of installer it came
      # from; the bare platform key is for a copy that cannot tell.
      - name: Write latest.json
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $bundle = 'src-tauri/target/release/bundle'
          $base = "https://github.com/${{ github.repository }}/releases/download/$tag"
          $nsis = "Tessera_${version}_x64-setup.exe"
          $msi = "Tessera_${version}_x64_en-US.msi"
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[)")
          $notes = if ($section.Success) { $section.Groups[1].Value.Trim() } else { "See the release on GitHub." }
          $manifest = [ordered]@{
            version = $version
            notes = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64-nsis' = @{ signature = (Get-Content "$bundle/nsis/$nsis.sig" -Raw).Trim(); url = "$base/$nsis" }
              'windows-x86_64-msi' = @{ signature = (Get-Content "$bundle/msi/$msi.sig" -Raw).Trim(); url = "$base/$msi" }
              'windows-x86_64' = @{ signature = (Get-Content "$bundle/nsis/$nsis.sig" -Raw).Trim(); url = "$base/$nsis" }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM latest.json

      # A draft on purpose: somebody reads the notes before the world does, and a
      # draft is not served at releases/latest, so no copy is offered it yet.
      - name: Publish a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $bundle = 'src-tauri/target/release/bundle'
          $notes = @'
          See CHANGELOG.md for what changed.

          The installers are not code-signed: Windows SmartScreen will warn on first run. Verify
          the download came from this Releases page. Copies of 1.4.0 and later update themselves
          from here, after checking each installer against Tessera's own key.
          '@
          gh release create $tag --draft --title "Tessera $tag" --notes $notes `
            "$bundle/nsis/Tessera_${version}_x64-setup.exe" `
            "$bundle/nsis/Tessera_${version}_x64-setup.exe.sig" `
            "$bundle/msi/Tessera_${version}_x64_en-US.msi" `
            "$bundle/msi/Tessera_${version}_x64_en-US.msi.sig" `
            latest.json
          if ($LASTEXITCODE -ne 0) { throw 'The draft release was not created.' }
