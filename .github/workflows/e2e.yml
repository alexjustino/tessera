name: End-to-end

# The real binary, driven through WebDriver (ADR-016).
#
# It does not work on a hosted runner: every session fails with "DevToolsActivePort
# file doesn't exist", on a clean machine, with a driver of the same version as the
# WebView2 runtime (seen November 2026). So it has no schedule: a weekly run would
# only ever be red. It stays runnable by hand, to try again after an image or a
# WebView2 change. The suite that counts runs on a developer machine (RELEASE.md).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: WebDriver suite
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Build the debug binary
        run: npm run e2e:build

      - name: Run the suite
        # The runner image ships Microsoft Edge WebDriver at $env:EdgeWebDriver.
        # Read in the shell: `${{ env.EdgeWebDriver }}` is the workflow's env, not
        # the machine's, so it was empty and no run of this workflow ever started.
        run: |
          $env:TESSERA_E2E_EDGEDRIVER = "$env:EdgeWebDriver\msedgedriver.exe"
          npm run e2e
        shell: pwsh

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e/artefacts
          if-no-files-found: ignore
