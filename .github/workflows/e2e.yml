name: End-to-end

# The real binary, driven through WebDriver (ADR-016). Not a pull-request gate:
# it needs a debug build and a driver that matches the runner's WebView2, and
# it takes minutes. Run it by hand before a release, or let the weekly run
# catch a seam that the unit suites cannot see.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  e2e:
    name: WebDriver suite
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Build the debug binary
        run: npm run e2e:build

      - name: Run the suite
        # The runner image ships Microsoft Edge WebDriver at $env:EdgeWebDriver.
        run: npm run e2e
        shell: pwsh
        env:
          TESSERA_E2E_EDGEDRIVER: ${{ env.EdgeWebDriver }}\msedgedriver.exe

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/artefacts
          if-no-files-found: ignore
